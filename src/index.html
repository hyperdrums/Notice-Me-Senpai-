<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'">
<title>Notice Me, Senpai!</title>
<style>
  /* 配色のルール（#18）
     - 強い色は「対応が必要なもの」だけ: 期限超過 --danger、期限間近 --soon、CI 失敗などの danger 系ラベル
     - 種別ラベル（To-Do の種類・作業アイテムの種別）は枠線と文字色だけの控えめな表示
     - 絞り込みの選択中は無彩色の反転表示。赤は「危険」の意味にだけ使う
     - MR の状態は角丸の別形状＋記号で示し、色だけに頼らない */
  :root {
    color-scheme: light dark;
    --text: #1f2328; --muted: #6e7781; --line: #d0d7de; --row-hover: #f3f4f6; --band: #f6f8fa;
    --danger: #c62828; --soon: #b35900;
    --chip-on-bg: #24292f; --chip-on-fg: #fff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --text: #e6edf3; --muted: #8b949e; --line: #30363d; --row-hover: #ffffff0d; --band: #ffffff08;
      --danger: #ff7b72; --soon: #e3a03d;
      --chip-on-bg: #e6edf3; --chip-on-fg: #0d1117;
    }
  }
  /* ラベルの色（明るい画面用）。暗い画面は下の prefers-color-scheme で差し替える */
  .t-review { --tone: #7448c2; } .t-assign { --tone: #8a5a14; } .t-mention { --tone: #2d5fbf; }
  .t-warn { --tone: #9a4a12; } .t-danger { --tone: #c62828; } .t-ok { --tone: #2f6f4f; }
  .t-muted { --tone: #6e7781; }
  @media (prefers-color-scheme: dark) {
    .t-review { --tone: #b8a3e0; } .t-assign { --tone: #d6b37a; } .t-mention { --tone: #8fb3eb; }
    .t-warn { --tone: #f0a77f; } .t-danger { --tone: #ff7b72; } .t-ok { --tone: #8cc3a2; }
    .t-muted { --tone: #8b949e; }
  }
  /* MR の状態（明るい画面用）。種別ラベルの .t-* とは名前も見た目も分ける */
  .s-open { --status: #1a7f37; } .s-draft { --status: #6e7781; } .s-merged { --status: #8250df; }
  .s-closed { --status: #c62828; } .s-unknown { --status: #6e7781; }
  @media (prefers-color-scheme: dark) {
    .s-open { --status: #3fb950; } .s-draft { --status: #8b949e; } .s-merged { --status: #a371f7; }
    .s-closed { --status: #ff7b72; } .s-unknown { --status: #8b949e; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 13px "Segoe UI", "Yu Gothic UI", sans-serif; color: var(--text); }
  header { display: flex; gap: 8px; align-items: center; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  header .tab { cursor: pointer; padding: 4px 8px; border-radius: 4px; color: var(--muted); white-space: nowrap; flex-shrink: 0; }
  header .tab.active { background: var(--band); color: var(--text); font-weight: 600; box-shadow: inset 0 -2px 0 var(--text); border-radius: 4px 4px 0 0; }
  header .spacer { flex: 1; }
  /* 幅が足りないときは、タブではなく件数・時刻の表示を省略する */
  #status { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  #refresh { flex-shrink: 0; }
  #error { color: var(--danger); padding: 6px 10px; display: none; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--line); cursor: pointer; }
  li:hover { background: var(--row-hover); }
  li .main { flex: 1; min-width: 0; }
  li .title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  li .meta, li .body { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* 種別ラベルは背景を塗らず、枠線と文字色だけ。行の主役（タイトル・期限）より目立たせない */
  .tag { display: inline-block; padding: 0 5px; border-radius: 3px; font-size: 11px; font-weight: 400; line-height: 15px; margin-right: 5px;
         color: var(--tone, var(--muted)); background: none;
         border: 1px solid color-mix(in srgb, var(--tone, #888) 45%, transparent); }
  /* 対応が必要な種類（CI 失敗・インシデントなど）だけは塗りで強調する */
  .tag.t-danger { color: #fff; background: var(--danger); border-color: var(--danger); }
  @media (prefers-color-scheme: dark) { .tag.t-danger { color: #0d1117; } }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; vertical-align: middle;
         margin-right: 5px; background: var(--tone, var(--muted)); }
  /* MR の状態: 角丸の形と先頭の記号で、種別ラベルと見分ける */
  .mr-status { display: inline-flex; align-items: center; gap: 3px; padding: 0 7px; border-radius: 9px; font-size: 11px; line-height: 16px;
               color: var(--status); border: 1px solid color-mix(in srgb, var(--status) 50%, transparent); white-space: nowrap; }
  .mr-status::before { font-size: 10px; line-height: 1; }
  .s-open::before { content: '●'; } .s-draft::before { content: '○'; } .s-merged::before { content: '✓'; }
  .s-closed::before { content: '✕'; } .s-unknown::before { content: '?'; }
  button { font: inherit; padding: 3px 10px; cursor: pointer; }
  li button { align-self: center; }
  .empty { padding: 24px; text-align: center; color: var(--muted); }
  li.separator { padding: 4px 10px; color: var(--muted); font-size: 12px; font-weight: 600; background: var(--band); cursor: default; }
  #assignedLimit { padding: 4px 10px; border-bottom: 1px solid var(--line); }
  .assigned-item-link, .recent-mr-links a { color: inherit; }
  .assigned-item-link, .related-mr-link, .recent-mr-links a { text-decoration: none; }
  .assigned-item-link:hover .title, .related-mr-link:hover, .recent-mr-links a:hover { text-decoration: underline; }
  .assigned-item-link { display: block; }
  .assigned-item-link:focus-visible, .related-mr-link:focus-visible,
  .recent-mr-links a:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }
  .related-mr-badges { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  #recentMrUpdates { background: var(--band); border-bottom: 1px solid var(--line); }
  #recentMrUpdatesTitle { margin: 0; padding: 6px 10px 3px; font-size: 11px; font-weight: 600; color: var(--muted); }
  #recentMrUpdatesList > li { border-bottom: none; }
  #recentMrUpdatesList { max-height: 144px; overflow-y: auto; }
  .recent-mr-update { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; padding-block: 5px; cursor: default; }
  .recent-mr-links { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 6px; align-items: center; }
  .recent-mr-links a { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .recent-mr-arrow, .recent-mr-time { color: var(--muted); }
  .recent-mr-detail { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .recent-mr-time { font-size: 11px; }
  #mrSyncError { margin: 0; padding: 5px 10px; border-bottom: 1px solid var(--line); color: var(--soon); }
  .bar { display: flex; flex-wrap: wrap; gap: 4px; padding: 6px 10px; border-bottom: 1px solid var(--line); }
  .bar:empty { display: none; }
  /* 絞り込みは無彩色。選択中だけ反転させ、色の意味（危険・種別）と混ぜない */
  .chip { cursor: pointer; padding: 1px 8px; border: 1px solid var(--line); border-radius: 10px; font-size: 12px; white-space: nowrap; color: var(--muted); }
  .chip:hover { color: var(--text); }
  .chip.active { background: var(--chip-on-bg); border-color: var(--chip-on-bg); color: var(--chip-on-fg); }
  .repos .chip { border-radius: 4px; }
  /* 期限: 通常は控えめ、間近は橙、超過は赤＋太字。優先度の一番高い情報 */
  .due { color: var(--muted); }
  .due.soon { color: var(--soon); font-weight: 600; }
  .due.over { color: var(--danger); font-weight: 700; }
  form { padding: 12px; display: grid; gap: 10px; }
  label { display: grid; gap: 4px; }
  label.check { display: flex; gap: 6px; align-items: center; }
  input[type=text], input[type=password], input[type=number], select { font: inherit; padding: 5px; }
  .hint { color: var(--muted); font-size: 12px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<header>
  <span class="tab active" data-view="list" data-i18n="tabList">To-Do</span>
  <span class="tab" data-view="assigned" id="assignedTab">作業アイテム</span>
  <span class="tab" data-view="settings" data-i18n="tabSettings">設定</span>
  <span class="spacer"></span>
  <span id="status"></span>
  <button id="refresh" data-i18n="refresh">更新</button>
</header>
<div id="error"></div>

<section id="list">
  <div class="bar repos" id="todoRepos"></div>
  <div class="bar" id="actions"></div>
  <ul id="todos"></ul>
</section>

<section id="assigned" class="hidden">
  <section id="recentMrUpdates" aria-labelledby="recentMrUpdatesTitle" hidden>
    <h2 id="recentMrUpdatesTitle" data-i18n="recentMrUpdates"></h2>
    <ul id="recentMrUpdatesList"></ul>
  </section>
  <p id="mrSyncError" class="hint t-warn" data-i18n="mrSyncError" hidden></p>
  <div class="bar repos" id="assignedRepos"></div>
  <div class="bar" id="assignedTypes"></div>
  <div class="hint hidden" id="assignedLimit"></div>
  <ul id="assignedItems"></ul>
</section>

<section id="settings" class="hidden">
  <form id="form">
    <label><span data-i18n="lblBaseUrl">GitLab URL</span>
      <input type="text" name="baseUrl" placeholder="https://gitlab.example.local">
    </label>
    <label><span data-i18n="lblToken">Personal Access Token（スコープ: read_api。完了操作もするなら api）</span>
      <input type="password" name="token" placeholder="保存済みの場合は空欄で維持">
    </label>
    <label><span data-i18n="lblInterval">取得間隔（秒, 最小15）</span>
      <input type="number" name="intervalSec" min="15" step="5">
    </label>
    <label class="check"><span data-i18n="lblLang">表示言語 / Language</span>
      <select name="lang">
        <option value="ja">日本語 (Japanese)</option>
        <option value="en">English (英語)</option>
      </select>
    </label>
    <label class="check"><input type="checkbox" name="notify"><span data-i18n="chkNotify">新着時にデスクトップ通知</span></label>
    <label class="check"><input type="checkbox" name="autoStart"><span data-i18n="chkAutoStart">Windows ログイン時に起動（最小化）</span></label>
    <label class="check"><input type="checkbox" name="insecure"><span data-i18n="chkInsecure">証明書エラーを無視（自己署名証明書のオンプレ用）</span></label>
    <div><button type="submit" data-i18n="btnSave">保存</button> <span id="saved" class="hint"></span></div>
    <p class="hint" data-i18n="hintToken">トークンは Windows の DPAPI で暗号化して保存されます。</p>
  </form>
</section>

<script src="lib.js"></script>
<script src="renderer.js"></script>
</body>
</html>
