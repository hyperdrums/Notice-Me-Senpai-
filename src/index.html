<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'">
<title>Notice Me, Senpai!</title>
<link rel="stylesheet" href="ui.css">
</head>
<body>
<div class="window-titlebar">
  <div class="window-drag">
    <span class="window-label"><span aria-hidden="true">/// </span>NMS</span>
    <span class="window-label" id="build-version"></span>
  </div>
  <button type="button" id="win-minimize" aria-label="最小化" title="最小化" data-i18n-label="winMinimize">_</button>
  <button type="button" id="win-close" aria-label="閉じる" title="閉じる" data-i18n-label="winClose">×</button>
</div>
<header>
  <button type="button" class="tab active" data-view="list" data-i18n="tabList">Activity</button>
  <button type="button" class="tab" data-view="assigned" id="assignedTab">Items</button>
  <button type="button" class="tab" data-view="settings" data-i18n="tabSettings" data-i18n-icon aria-label="設定" title="設定">
    <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3.2"/>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
    </svg>
  </button>
  <span class="spacer"></span>
  <span id="status"></span>
  <button type="button" id="refresh" data-i18n="refresh" data-i18n-icon aria-label="更新" title="更新">
    <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 4v6h-6m6 0a8 8 0 1 0 .1 4"/>
    </svg>
  </button>
</header>
<div id="error" class="hidden"></div>

<section id="list">
  <div class="bar repos" id="todoRepos"></div>
  <div class="bar" id="actions"></div>
  <ul id="todos"></ul>
</section>

<section id="assigned" class="hidden">
  <p id="mrSyncError" class="hint" data-i18n="mrSyncError" hidden></p>
  <div class="bar repos" id="assignedRepos"></div>
  <div class="bar" id="assignedTypes"></div>
  <div class="hint hidden" id="assignedLimit"></div>
  <ul id="assignedItems"></ul>
</section>

<section id="settings" class="hidden">
  <form id="form">
    <label><span data-i18n="lblBaseUrl">GitLab URL</span>
      <input type="text" name="baseUrl" placeholder="https://gitlab.example.local">
    </label>
    <label><span data-i18n="lblToken">Personal Access Token（スコープ: read_api。完了操作もするなら api）</span>
      <input type="password" name="token" placeholder="保存済みの場合は空欄で維持">
    </label>
    <label><span data-i18n="lblInterval">取得間隔（秒, 最小15）</span>
      <input type="number" name="intervalSec" min="15" step="5">
    </label>
    <label class="check"><span data-i18n="lblLang">表示言語 / Language</span>
      <select name="lang">
        <option value="ja">日本語 (Japanese)</option>
        <option value="en">English (英語)</option>
      </select>
    </label>
    <label class="check"><input type="checkbox" name="notify"><span data-i18n="chkNotify">新着時にデスクトップ通知</span></label>
    <label class="check"><input type="checkbox" name="autoStart"><span data-i18n="chkAutoStart">Windows ログイン時に起動（最小化）</span></label>
    <label class="check"><input type="checkbox" name="insecure"><span data-i18n="chkInsecure">証明書エラーを無視（自己署名証明書のオンプレ用）</span></label>
    <div><button type="submit" data-i18n="btnSave">保存</button> <span id="saved" class="hint"></span></div>
    <p class="hint" data-i18n="hintToken">トークンは Windows の DPAPI で暗号化して保存されます。</p>
  </form>
</section>

<script src="lib.js"></script>
<script src="renderer.js"></script>
</body>
</html>
